<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jacey's Unicorn Magic</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Fredoka","Baloo 2","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;color:#5b2c83;background:#e9d8ff}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(#ffffffaa 2px,transparent 3px) 0 0/44px 44px,linear-gradient(#e6d4ff,#ffd9f1)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;border-radius:24px;background:#fff;box-shadow:0 5px 0 #c9a3d966;min-height:48px}button:active{transform:translateY(3px)}
#bar{display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:700;font-size:20px}#bar .p{background:#fff;border-radius:18px;padding:4px 12px;box-shadow:0 3px 0 #c9a3d966}#bar button{font-size:24px;padding:0 12px;min-height:44px}.sp{flex:1}
#home,#game{flex:1;min-height:0;display:none;flex-direction:column;align-items:center;padding:0 12px 10px}
.logo{text-align:center;line-height:.95;font-weight:700}.logo span{font-size:30px;color:#ff6fb5}.logo div{font-size:clamp(38px,12vw,56px);background:linear-gradient(90deg,#ff6fb5,#b57bff,#5ac8fa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #fff)}
.jac{height:clamp(110px,24vh,210px);animation:bob 2.4s ease-in-out infinite}
#tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:460px;flex:1;min-height:0;grid-auto-rows:1fr;margin-top:6px}
.t{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:clamp(14px,4vw,20px);border:4px solid #fff;background:linear-gradient(#fff,#ffeaf7)}.t i{font-style:normal;font-size:clamp(30px,10vw,52px)}
#pr{background:#fff;border-radius:26px;padding:10px 16px;font-weight:700;font-size:clamp(24px,7.5vw,38px);text-align:center;display:flex;gap:10px;align-items:center;justify-content:center;border:4px solid #ffb3de;width:100%;max-width:520px}
#ex{font-size:30px;text-align:center;min-height:6px;line-height:1.1;max-width:420px;margin-top:4px}#ms{min-height:30px;font-weight:700;font-size:22px;color:#c2358a;text-align:center;margin:2px 0}
#gr{display:grid;gap:12px;width:100%;max-width:520px;flex:1;min-height:0;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}#gr .c:last-child:nth-child(odd){grid-column:1/-1}#gr.n2{grid-template-columns:1fr}
.c{display:flex;align-items:center;justify-content:center;border:5px solid #fff;background:linear-gradient(#fff,#fff0fa);min-height:0;padding:6px;overflow:hidden}
.c svg{height:80%;max-width:80%}.em{font-size:clamp(60px,20vw,110px);line-height:1}.L{font-size:clamp(70px,24vw,130px);line-height:1}.dot{width:min(60%,120px);aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -8px 0 #0002,0 4px 0 #0001}
.c.yes{background:#d9ffe6;border-color:#7be0a3;animation:pop .6s}.c.no{opacity:.4;animation:wig .4s}.c.hint{animation:pulse .8s infinite alternate;border-color:#ffd23f}
#ft{height:64px;display:flex;align-items:center;justify-content:center}.nx{font-size:34px;background:#ff8fcf;color:#fff;width:120px;box-shadow:0 5px 0 #c2358a}
.ov{position:fixed;inset:0;background:#5b2c83cc;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}.ov>div{background:#fff;border-radius:30px;padding:16px;max-width:520px;width:100%;max-height:92dvh;overflow:auto;text-align:center}
h2{margin:0 0 8px}.egg{font-size:130px;animation:bob 1.2s infinite;cursor:pointer}.egg.shk{animation:wig .3s infinite}.big svg{width:min(80%,320px)}.big2{background:#ff8fcf;color:#fff;font-size:26px;padding:8px 30px;font-weight:700}
.col{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.u{background:#f6ebff;border-radius:18px;padding:4px;font-size:13px;font-weight:700}.u svg{width:100%}.u.lock{opacity:.5;filter:grayscale(1)}
#kb{display:flex;gap:4px;height:36vh}.k{flex:1;border-radius:0 0 14px 14px;border:3px solid #c9a3d9;background:#fff;font-size:14px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-shadow:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}.ch{position:fixed;right:8px;bottom:8px;z-index:9;display:flex;align-items:flex-end;animation:up 1.8s forwards;pointer-events:none}.ch img{height:130px}.ch b{background:#fff;border-radius:18px;padding:6px 12px;font-size:22px;margin-bottom:90px}
@keyframes bob{50%{transform:translateY(-8px)}}@keyframes wig{25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}@keyframes pop{40%{transform:scale(1.1)}}@keyframes pulse{to{transform:scale(1.05)}}@keyframes up{0%{transform:translateY(160px)}15%,80%{transform:none}100%{transform:translateY(160px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"><div id="bar"><button id="bh">🏠</button><span class="p">⭐<span id="st">0</span></span><span class="p">🦄<span id="un">0</span></span><span class="sp"></span><button id="bm">🔊</button></div>
<div id="home"></div><div id="game"><div id="pr"><span id="pt"></span><button id="sy">🔈</button></div><div id="ex"></div><div id="ms"></div><div id="gr"></div><div id="ft"></div></div></div>
<div class="ov" id="ov"><div id="ovc"></div></div><canvas id="fx"></canvas>

function say(t){try{if(!S.sound||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.pitch=1.3;speechSynthesis.speak(u)}catch(e){}}
const fx=$('fx'),fc=fx.getContext('2d');let P=[],run=false;
function dust(x,y,n=40){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;if(rm)n=8;fx.width=innerWidth;fx.height=innerHeight;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*4;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,e:pick(['✨','⭐','💖','🌟','✦','💜']),s:14+Math.random()*16})}if(!run){run=true;(function f(){fc.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.98;p.l-=.014;fc.globalAlpha=Math.max(p.l,0);fc.font=p.s+'px serif';fc.fillText(p.e,p.x,p.y)});if(P.length)requestAnimationFrame(f);else{run=false;fc.clearRect(0,0,fx.width,fx.height)}})()}}
const ov=h=>{$('ovc').innerHTML=h;$('ov').style.display='flex'},cl=()=>$('ov').style.display='none';
const pend=()=>S.uni<UN.length&&Math.floor(S.stars/5)>S.uni;
function hud(){$('st').textContent=S.stars;$('un').textContent=S.uni;$('bm').textContent=S.sound?'🔊':'🔇'}
let cat='mix',cur,recent=[],qid=0,locked=false,wrong=0,corr=0,inGame=false;
function B(pool,key,vis,prompt,after){let t,n=0;do{t=pick(pool)}while(recent.includes(key(t))&&n++<20);recent.push(key(t));if(recent.length>4)recent.shift();const k=S.stars<10?2:3;const ds=shuf(pool.filter(x=>key(x)!=key(t))).slice(0,k-1);return{items:shuf([t,...ds]).map(x=>({v:vis(x),ok:x===t})),pr:prompt(t),af:after(t),extra:''}}
function Q(){const c=cat=='mix'?pick(['abc','obj','shp','col','ani','num']):cat;
if(c=='abc')return B(LET,x=>x[0],x=>`<b class="L" style="color:${PAL[x[0].charCodeAt(0)%6]}">${x[0]}</b>`,t=>`Find the letter ${t[0]}!`,t=>`${t[0]} is for ${t[1]} ${t[2]}`);
if(c=='obj'||c=='ani'){const L=c=='obj'?OBJ:ANI;return B(L,x=>x[0],x=>`<span class="em">${x[1]}</span>`,t=>`Find the ${t[0]}!`,t=>`Yay! ${t[1]} ${t[0]}!`)}
if(c=='shp')return B(SHP,x=>x[0],x=>`<svg viewBox="0 0 100 100" fill="${PAL[SHP.indexOf(x)%6]}" stroke="#fff" stroke-width="4">${x[1]}</svg>`,t=>`Find the ${t[0]}!`,t=>`That's a ${t[0]}!`);
if(c=='col')return B(COL,x=>x[0],x=>`<i class="dot" style="background:${x[1]}"></i>`,t=>`Find the color ${t[0]}!`,t=>`That's ${t[0]}!`);
const mx=S.stars<10?5:10,find=Math.random()<.5,e=pick(['🍎','🦄','🌸','⭐','🎈']);let ex='';const r=B(Array.from({length:mx},(_,i)=>i+1),x=>x,x=>`<b class="L" style="color:${PAL[x%6]}">${x}</b>`,t=>{ex=e.repeat(t);return find?`Find number ${t}!`:'How many do you see?'},t=>`${t}! ${e.repeat(t)}`);r.extra=ex;return r}
function level(){inGame=true;locked=false;wrong=0;++qid;cl();if(pend())return reveal(true);cur=Q();$('pt').textContent=cur.pr;$('ex').textContent=cur.extra;$('ms').textContent='';$('ft').innerHTML='';const g=$('gr');g.className='n'+cur.items.length;g.innerHTML=cur.items.map((it,i)=>`<button class="c" data-i="${i}">${it.v}</button>`).join('');setTimeout(()=>say(cur.pr),350)}
function adv(){qid++;level()}
$('gr').onclick=e=>{au();const b=e.target.closest('.c');if(!b||locked||b.classList.contains('no'))return;const it=cur.items[+b.dataset.i];
if(it.ok){locked=true;corr++;b.classList.add('yes');S.stars++;save();hud();snd('good');const r=b.getBoundingClientRect();dust(r.left+r.width/2,r.top+r.height/2);$('ms').textContent=cur.af;say(cur.af.replace(/[^\x00-\x7F]/g,''));$('ft').innerHTML='<button class="nx" id="nx">➜</button>';$('nx').onclick=adv;if(corr%3==0)cheer();const id=qid;setTimeout(()=>{if(id==qid)adv()},pend()?1300:2400)}
else{wrong++;b.classList.add('no');snd('bad');$('ms').textContent='Try again! 💗';if(wrong>=2)$('gr').children[cur.items.findIndex(x=>x.ok)].classList.add('hint')}};
$('sy').onclick=()=>{au();say(cur.pr)};
function cheer(){const d=document.createElement('div');d.className='ch';d.innerHTML=`<b>${pick(['Yay!','Wow!','Great!','Hooray!'])}</b><img src="${JAC}" alt="">`;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
function reveal(game){au();ov(`<h2>✨ A magic egg!</h2><div class="egg" id="egg">🥚</div><p><b>Tap it!</b></p>`);let l=false;$('egg').onclick=()=>{if(l)return;l=true;$('egg').classList.add('shk');snd('tap');setTimeout(()=>{if(!pend()){cl();if(game)level();return}const i=S.uni++;save();hud();snd('rev');dust(innerWidth/2,innerHeight/3,70);ov(`<h2>🦄 Meet ${UN[i][0]}!</h2><div class="big">${uni(i)}</div><img class="jac" style="height:110px" src="${JAC}" alt=""><p><button class="big2" id="ok">Yay! 💖</button></p>`);$('ok').onclick=()=>{cl();if(game)level()};say('Yay! Meet '+UN[i][0])},800)}}
function home(){inGame=false;qid++;$('game').style.display='none';$('home').style.display='flex';$('bh').style.visibility='hidden';
const T=[['abc','🔤','ABC'],['obj','🧸','Things'],['shp','🔷','Shapes'],['col','🎨','Colors'],['ani','🐰','Animals'],['num','🔢','Numbers'],['mix','🌈','Magic Mix'],['uni','🦄','Unicorns'],['pia','🎹','Piano']];
$('home').innerHTML=`<div class="logo"><span>Jacey's</span><div>Unicorn Magic</div></div><img class="jac" src="${JAC}" alt=""><div id="tiles">${T.map(t=>`<button class="t" data-k="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</div><button id="gear" style="min-height:36px;font-size:14px;margin-top:8px;opacity:.7">⚙️ Grown-ups</button>`}
$('home').onclick=e=>{au();const b=e.target.closest('button');if(!b)return;if(b.id=='gear')return settings();const k=b.dataset.k;if(!k)return;snd('tap');if(k=='uni')return coll();if(k=='pia')return piano();cat=k;$('home').style.display='none';$('game').style.display='flex';$('bh').style.visibility='visible';level()};
function coll(){if(pend())return reveal(false);ov(`<h2>🦄 My Unicorns (${S.uni}/${UN.length})</h2><div class="col">${UN.map((u,i)=>i<S.uni?`<div class="u">${uni(i)}${u[0]}</div>`:`<div class="u lock">${uni(i)}?</div>`).join('')}</div><p>⭐ Get 5 stars for a new unicorn!</p><button class="big2" id="ok">OK</button>`);$('ok').onclick=cl}
function piano(){const K=[['C',261.63],['D',293.66],['E',329.63],['F',349.23],['G',392],['A',440],['B',493.88],['C',523.25]],c=['#ff9ed2','#ffb86b','#ffe27a','#8fe0c0','#8fd3ff','#b9a0ff','#ff8fb8','#ff9ed2'];ov(`<h2>🎹 Jacey's Piano</h2><div id="kb">${K.map((k,i)=>`<button class="k" data-f="${k[1]}" style="border-top:14px solid ${c[i]}">${k[0]}</button>`).join('')}</div><p><button class="big2" id="ok">OK</button></p>`);$('ok').onclick=cl;$('kb').onclick=e=>{const b=e.target.closest('.k');if(!b)return;au();tone(+b.dataset.f,0,.9,'triangle',.18);const r=b.getBoundingClientRect();dust(r.left+r.width/2,r.top,6)}}
function settings(){ov(`<h2>⚙️ Grown-ups</h2><p>⭐ ${S.stars} stars · 🦄 ${S.uni} unicorns</p>${ok?'<p><small>Progress is saved on this device and browser only.</small></p>':'<p>⚠️ This browser is not saving progress (private mode?).</p>'}<p><button id="rs">Reset all progress</button></p><p><button class="big2" id="ok">OK</button></p>`);$('ok').onclick=cl;$('rs').onclick=()=>{if(confirm('Erase all of Jacey\'s stars and unicorns?')){S=Object.assign({},D0);save();hud();cl()}}}
$('bh').onclick=()=>{snd('tap');home()};$('bm').onclick=()=>{au();S.sound=!S.sound;save();hud();snd('tap')};
$('ov').onclick=e=>{if(e.target.id=='ov'&&!$('egg')&&!$('ovc').querySelector('.big'))cl()};
hud();home();
</script></body></html>
